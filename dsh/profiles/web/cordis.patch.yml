# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# dsh-web-app disables the host-level skill-filesystem row (presets remount
# it per-agent). Keep the host row on so $DSH_HOME/skills is visible in the
# web skill list, not only after a preset session starts.
- id: skill-filesystem
  disabled: false
