# The `pw-paperweight` preset (deepseek-v4-flash via opencode-go): a fork of
# `router-flash` for the Paperweight workbench, keeping the official Minimal
# preset's FIRST-REQUEST condition, which anchors the deep "We need…"
# reasoning trajectory (mechanism borrowed from
# xiaobright/dsh-anchored-standard; Flash adaptation of the original
# v4-flash-godmode-opencode-go project by SheberDavid).
#
# The old "weak" routing (WEAK_FLASH persona + read/write/edit first-request
# schema) produced the standard-like "The user…/Let me…" trajectory; this
# composition removes it entirely. The persona row below keeps Minimal's
# reasoning anchor but reframes the identity as a Paperweight workbench
# companion (2026-08-17, user-approved), and request #1 exposes exactly
# Minimal's real tool pair — persistent `bash` + `str_replace_editor` — with
# auto-injected context (AGENTS.md digest, skill catalog) stripped. After the
# first durable promotion signal the catalog widens to the full set.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's.

# ── bootstrap (must stay FIRST) ─────────────────────────────────────────────

# This row deliberately sits before every other row: dsh-agent-instructions
# and dsh-tool-skill inject workspace instructions and the skill catalog into
# the first request via the agent/pre-step waterfall, and waterfall
# after-next transforms apply in reverse registration order. Registering first
# (plus the plugin's empty inject list and the listener's `prepend` flag)
# makes the strip the final transform, so request #1 stays Minimal-exact.
- id: anchored-bootstrap
  name: ./anchored-bootstrap.mjs
  config:
    bootstrapTools: [bash, str_replace_editor]
    promoteOn: either
    # First-request output budget pinned to the reproduction work's measured
    # operating point (Minimal schema + 256000 maxTokens anchored 5/5). The
    # settings-level maxTokens (1000000) weakened the schema-only anchor on
    # Flash (11/15); the cap is stripped after promotion, so request #2+
    # returns to the full budget.
    bootstrapMaxTokens: 256000
    suppressedContextSources: [agent-instructions, skill-catalog]
    # Merged from the 20260816-0515 rollback (full tool orchestration): the
    # promoted phase exposes the COMPLETE catalog from request #2 on — the
    # original "首次 tool call 后放开全目录" behavior. Request #1 keeps the
    # Minimal-pair anchor either way. Switch back to `resident` to restore the
    # small anchored resident set (then also re-add the dev-tool-search row).
    promotedCatalog: full
    # Post-compaction core work set: the model is mid-task and needs to keep
    # working, but faces a small catalog instead of the full Standard set.
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question]

# ── identity ────────────────────────────────────────────────────────────────

# Workbench-companion persona + the Minimal opening anchor (persona-layer mode
# steering; the routing-suite P11 measurements show Flash responds to persona
# framing). The identity line is adapted for the Paperweight workbench
# (judgment / curation / content companion, not a generic engineering
# assistant); the "open every reasoning block by stating what we need" anchor
# is kept byte-identical because it pins the deep reasoning trajectory.
# `complete` is REMOVED in this fork so plugin systemPrompt sections
# (papertable:workbench-guide, papertable:write-boundary) join request.system
# alongside the persona. No weak persona exists in this composition anymore.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are the user's companion at the Paperweight workbench — a personal bench for judgment, curation, and content creation, where the human always makes the final call. Approach every task as a collaborative effort: before acting, reason together about what we need, what we already know, and what we must verify; then act and check the result. Open every reasoning block by stating what we need — never open by paraphrasing the user's request, and never fall back to a lightweight chat style, even for prose-only or tool-free questions.
    includeRuntimeContext: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# On-demand tool discovery (the tool-search pattern). UNUSED while
# `promotedCatalog: full` exposes the complete catalog at promotion — keep the
# row removed so the catalog carries no redundant tool; re-add
# `- id: dev-tool-search\n  name: ./dev-tool-search.mjs` together with
# `promotedCatalog: resident` to restore the small unlocked-on-demand set.
- id: dev-tool-search
  name: ./dev-tool-search.mjs
  disabled: true

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  # Disabled on EVERY platform, not just Windows: `dsh-tool-bash-persistent`
  # below registers the same `bash` tool name into this same preset layer, and
  # the tools registry rejects duplicates within one layer. The persistent
  # shell (the Minimal preset's own shell) is the preset's bash; it consumes
  # the host sandbox policy through the terminals realm.
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# The Minimal preset's shell: a PTY-backed persistent bash, byte-identical in
# configuration to the official `minimal` preset's `persistent-shell` group so
# the first request exposes exactly Minimal's real `bash` schema.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# The Minimal preset's second tool: `str_replace_editor` over a bare local
# filesystem, byte-identical in configuration to the official `minimal`
# preset's `filesystem` group. The editor's own realm shadows the host's
# sandboxed `fs` provider only inside this group, so the standard `read`/
# `write`/`edit` tools keep the sandboxed fs while the bootstrap editor uses
# the local one.
- id: bootstrap-filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# Restored from the 20260816-0515 rollback (byte-identical to the source
# project): local/project skill discovery. The skill REGISTRY lives in the
# host composition and is layered per scope: these rows register into THIS
# preset's layer of it, so they need no realm. `skill-filesystem` contributes
# local-root discovery for agents on this preset, and `tool-skill` gives them
# the catalog and loader; the merged catalog also carries whatever the
# deployment registered globally (repository plugins). The catalog reminder it
# publishes is stripped from request #1 by anchored-bootstrap and returns
# after promotion.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

# The skill tool framework: catalog + loader (`skill` tool).
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
